    .field { display:flex; gap:10px; }
    input { min-width:0; flex:1; border:1px solid var(--line); border-radius:9px; padding:13px 14px; background:#090a0c; color:var(--text); font:inherit; outline:none; }

    #status { min-height:1.5em; margin:12px 0 0; color:var(--error); font-size:.76rem; }
    .privacy { margin:24px 0 0; padding-top:18px; border-top:1px solid var(--line); color:#70757d; font-size:.68rem; }
    @media (max-width:480px) { main { padding:24px 20px; } .field { flex-direction:column; } button { min-height:46px; } }

    });
    const form = document.querySelector("#unlock-form");
    const input = document.querySelector("#password");
    const button = document.querySelector("#unlock");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      button.disabled = true;
      button.textContent = "Άνοιγμα…";

      try {
        const passwordBytes = new TextEncoder().encode(input.value);
        const material = await crypto.subtle.importKey("raw", passwordBytes, "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: fromBase64(envelope.salt), iterations: envelope.iterations, hash: "SHA-256" },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const plaintext = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: fromBase64(envelope.iv), tagLength: 128 },
          key,
          fromBase64(envelope.payload)
        );
        const html = new TextDecoder("utf-8", { fatal: true }).decode(plaintext);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        input.select();
        status.textContent = "Ο κωδικός δεν είναι σωστός. Δοκιμάστε ξανά.";
        button.disabled = false;
        button.textContent = "Ξεκλείδωμα";
      }
    });

    function fromBase64(value) {
      return Uint8Array.from(atob(value), character => character.charCodeAt(0));
    }
  </script>
