name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The live page is the static parallax site in web/ (source of truth: tlc.pen frame lWwes).
      # The previous Next.js tower stays in the repo and in history; its build is not part of the deploy.
      - run: npm run build:web
      - run: node --test tests/web.test.mjs tests/protected-offer.test.mjs tests/easyhome-deck.test.mjs
